name: SonarQube Analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Adjust to your project's version

      - name: Install SonarScanner and Coverage Tool
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Build and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Created in SonarQube Cloud
        run: |
          # Begin analysis (tells Sonar where the coverage file will be)
          dotnet sonarscanner begin /k:"CPUrepairSYS" \
            /o:"Kevin-Molloy" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
          
          # Build
          dotnet build --no-incremental
          
          # Test with coverage
          dotnet-coverage collect "dotnet test" -f xml -o "coverage.xml"
          
          # End analysis
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"